name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Archive
    runs-on: macos-15
    timeout-minutes: 30

    # Map secrets to env vars so they can be used in `if:` conditions.
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            echo "Available Xcode versions:"
            ls /Applications/ | grep Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Show build settings
        run: xcodebuild -project ArkDownloader.xcodeproj -scheme ArkDownloader -showBuildSettings | head -80

      # ---------------------------------------------------------------
      # 1) Simulator build — verifies compilation, no signing required
      # ---------------------------------------------------------------
      - name: Build for Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_PREVIEWS=NO \
            | xcpretty

      - name: Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-Simulator
          path: build/Debug-iphonesimulator/ArkDownloader.app
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # 2) Device build — produces an unsigned .app, then .ipa
      #    Using `build -sdk iphoneos` instead of `archive` because
      #    archive enforces code signing even with CODE_SIGNING_ALLOWED=NO.
      #    Re-sign with AltStore / Sideloadly / Xcode (free Apple ID).
      # ---------------------------------------------------------------
      - name: Build for Device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_PREVIEWS=NO \
            | xcpretty

      - name: Locate .app & package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found. Listing build dir:"
            ls -la build/
            ls -la build/Release-iphoneos/ 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -qr ArkDownloader-unsigned.ipa Payload
          echo "IPA created: $(pwd)/ArkDownloader-unsigned.ipa ($(du -h ArkDownloader-unsigned.ipa | cut -f1))"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-unsigned-ipa
          path: build/ipa/ArkDownloader-unsigned.ipa

      # ---------------------------------------------------------------
      # 3) Signed archive (only when signing secrets are provided)
      #    Set GitHub Secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
      #    BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD
      # ---------------------------------------------------------------
      - name: Import signing assets
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & export signed .ipa
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ArkDownloader.xcarchive \
            | xcpretty
          xcodebuild -exportArchive \
            -archivePath build/ArkDownloader.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist <(printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>method</key><string>development</string><key>signingStyle</key><string>manual</string></dict></plist>') \
            | xcpretty

      - name: Upload signed .ipa
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-signed-ipa
          path: build/signed/*.ipa









