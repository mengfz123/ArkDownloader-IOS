name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Archive
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    # Map secrets to env vars so they can be used in `if:` conditions.
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use default Xcode
        run: |
          set -euo pipefail
          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version
          echo ""
          echo "Installed Xcodes:"
          ls /Applications/ | grep -i xcode || true
          echo ""
          echo "Installed simulator runtimes:"
          xcrun simctl list runtimes || true

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Show build settings
        run: xcodebuild -project ArkDownloader.xcodeproj -scheme ArkDownloader -showBuildSettings | head -80

      # ---------------------------------------------------------------
      # 1) Simulator build — verifies compilation, no signing required
      # ---------------------------------------------------------------
      - name: Build for Simulator
        run: |
          set -uo pipefail
          set +e
          mkdir -p build/ci-logs
          LOG=build/ci-logs/xcodebuild-simulator.log
          xcodebuild -version || true
          xcodebuild build \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee "$LOG" | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=================== RAW ERROR LINES ==================="
            grep -E "error:|fatal error:" "$LOG" | head -30 || true
            echo "================ FAILED BUILD COMMANDS ================"
            sed -n "/The following build commands failed:/,/^[[:space:]]*$/p" "$LOG" | head -40 || true
            echo "=================== LAST 40 LINES ====================="
            tail -n 40 "$LOG" || true
            {
              echo "## Build for Simulator failed (exit $status)"
              echo ""
              echo "### error lines"
              echo '```'
              grep -E "error:|fatal error:" "$LOG" | head -30 || true
              echo '```'
              echo "### failed build commands"
              echo '```'
              sed -n "/The following build commands failed:/,/^[[:space:]]*$/p" "$LOG" | head -40 || true
              echo '```'
              echo "### last 60 lines of raw log"
              echo '```'
              tail -n 60 "$LOG" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BUILD FAILED with exit code $status"
            grep -E "error:|fatal error:" "$LOG" | head -4 | while IFS= read -r line; do
              echo "::error::error-line: $line"
            done || true
            tail -n 4 "$LOG" | while IFS= read -r line; do
              echo "::error::tail: $line"
            done || true
            git config user.email "ci-bot@users.noreply.github.com"
            git config user.name "CI Bot"
            git add -f build/ci-logs/*.log || true
            git commit -m "ci: raw build log for run ${GITHUB_RUN_ID}" || true
            git push -f origin HEAD:refs/heads/ci-logs || echo "WARN: could not push raw log branch"
            exit "$status"
          fi

      - name: Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-Simulator
          path: build/Debug-iphonesimulator/ArkDownloader.app
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # 2) Device build — produces an unsigned .app, then .ipa
      #    Using `build -sdk iphoneos` instead of `archive` because
      #    archive enforces code signing even with CODE_SIGNING_ALLOWED=NO.
      #    Re-sign with AltStore / Sideloadly / Xcode (free Apple ID).
      # ---------------------------------------------------------------
      - name: Build for Device (unsigned)
        run: |
          set -uo pipefail
          set +e
          mkdir -p build/ci-logs
          LOG=build/ci-logs/xcodebuild-device.log
          xcodebuild build \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_PREVIEWS=NO \
            2>&1 | tee "$LOG" | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=================== RAW ERROR LINES ==================="
            grep -E "error:|fatal error:" "$LOG" | head -30 || true
            echo "================ FAILED BUILD COMMANDS ================"
            sed -n "/The following build commands failed:/,/^[[:space:]]*$/p" "$LOG" | head -40 || true
            echo "=================== LAST 40 LINES ====================="
            tail -n 40 "$LOG" || true
            {
              echo "## Build for Device failed (exit $status)"
              echo ""
              echo "### error lines"
              echo '```'
              grep -E "error:|fatal error:" "$LOG" | head -30 || true
              echo '```'
              echo "### failed build commands"
              echo '```'
              sed -n "/The following build commands failed:/,/^[[:space:]]*$/p" "$LOG" | head -40 || true
              echo '```'
              echo "### last 60 lines of raw log"
              echo '```'
              tail -n 60 "$LOG" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BUILD FAILED with exit code $status"
            grep -E "error:|fatal error:" "$LOG" | head -4 | while IFS= read -r line; do
              echo "::error::error-line: $line"
            done || true
            tail -n 4 "$LOG" | while IFS= read -r line; do
              echo "::error::tail: $line"
            done || true
            git config user.email "ci-bot@users.noreply.github.com"
            git config user.name "CI Bot"
            git add -f build/ci-logs/*.log || true
            git commit -m "ci: raw build log for run ${GITHUB_RUN_ID}" || true
            git push -f origin HEAD:refs/heads/ci-logs || echo "WARN: could not push raw log branch"
            exit "$status"
          fi

      - name: Locate .app & package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found. Listing build dir:"
            ls -la build/
            ls -la build/Release-iphoneos/ 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -qr ArkDownloader-unsigned.ipa Payload
          echo "IPA created: $(pwd)/ArkDownloader-unsigned.ipa ($(du -h ArkDownloader-unsigned.ipa | cut -f1))"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-unsigned-ipa
          path: build/ipa/ArkDownloader-unsigned.ipa

      - name: Upload raw CI build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-raw-logs
          path: build/ci-logs
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # 3) Signed archive (only when signing secrets are provided)
      #    Set GitHub Secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
      #    BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD
      # ---------------------------------------------------------------
      - name: Import signing assets
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & export signed .ipa
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ArkDownloader.xcodeproj \
            -scheme ArkDownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ArkDownloader.xcarchive \
            | xcpretty
          xcodebuild -exportArchive \
            -archivePath build/ArkDownloader.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist <(printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>method</key><string>development</string><key>signingStyle</key><string>manual</string></dict></plist>') \
            | xcpretty

      - name: Upload signed .ipa
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ArkDownloader-signed-ipa
          path: build/signed/*.ipa









